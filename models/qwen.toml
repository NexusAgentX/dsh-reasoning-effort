# 阿里云 Qwen 系列
# 模型目录源文件：新增/修改模型时编辑本文件，然后运行 pnpm run generate:models。
# pricing 和 reasoningEfforts 中的 null 通过省略字段表示；off 档位由生成器自动加入。

family = "qwen"
description = "阿里云 Qwen 系列"

[[models]]
model = "qwen3.7-max"
aliases = []
input = [ "text" ]
contextWindow = 1000000
maxOutputTokens = 65536

[models.pricing]
currency = "USD"
unit = "per_million_tokens"
input = 2.5
output = 7.5
region = "Singapore International"
conditions = "Official list price; a time-limited discount may apply."

[models.reasoningEfforts]
high = "high"

[models.sources]
capabilities = "https://models.dev/api.json"
pricing = "https://www.alibabacloud.com/help/en/model-studio/model-pricing"

