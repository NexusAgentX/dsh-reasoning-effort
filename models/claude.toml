# Anthropic Claude 系列
# 模型目录源文件：新增/修改模型时编辑本文件，然后运行 pnpm run generate:models。
# pricing 和 reasoningEfforts 中的 null 通过省略字段表示；off 档位由生成器自动加入。

family = "claude"
description = "Anthropic Claude 系列"

[[models]]
model = "claude-opus-4.6"
aliases = []
input = [ "text", "image" ]
contextWindow = 1000000
maxOutputTokens = 128000

[models.pricing]
currency = "USD"
unit = "per_million_tokens"
input = 5
output = 25
cacheRead = 0.5
cacheWrite = 6.25

[[models.pricing.tiers]]
condition = "1h cache write"
cacheWrite = 10

[models.reasoningEfforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

[models.sources]
capabilities = "https://models.dev/api.json"
pricing = "https://docs.anthropic.com/en/docs/about-claude/pricing"

