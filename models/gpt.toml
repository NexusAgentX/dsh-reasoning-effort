# OpenAI GPT 系列
# 模型目录源文件：新增/修改模型时编辑本文件，然后运行 pnpm run generate:models。
# pricing 和 reasoningEfforts 中的 null 通过省略字段表示；off 档位由生成器自动加入。

family = "gpt"
description = "OpenAI GPT 系列"

[[models]]
model = "gpt-5.4"
aliases = []
input = [ "text", "image" ]
contextWindow = 1050000
maxOutputTokens = 128000

[models.pricing]
currency = "USD"
unit = "per_million_tokens"
input = 2.5
output = 15
cacheRead = 0.25

[models.reasoningEfforts]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"

[models.sources]
capabilities = "https://models.dev/api.json"
pricing = "https://developers.openai.com/api/docs/models/gpt-5.4"

